services:
  postgres:
    image: postgres:16
    container_name: opsboard-postgres
    environment:
      POSTGRES_DB: opsboard
      POSTGRES_USER: opsboard
      POSTGRES_PASSWORD: opsboard_password
    ports:
      - "5432:5432"
    volumes:
      - opsboard_pgdata:/var/lib/postgresql/data
    networks:
      - opsboard_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opsboard -d opsboard"]
      interval: 5s
      timeout: 3s
      retries: 20

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: opsboard-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin_password
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - opsboard_net

  laravel:
    build:
      context: ../opsboard-laravel
      dockerfile: Dockerfile
    container_name: opsboard-laravel-app
    working_dir: /var/www
    volumes:
      - ../opsboard-laravel:/var/www
    ports:
      - "8010:8000"
    depends_on:
      - postgres
    networks:
      - opsboard_net
    command: >
      sh -c "composer install &&
             php artisan key:generate --force &&
             php artisan serve --host=0.0.0.0 --port=8000"
    restart: unless-stopped

  django:
    build:
      context: ../opsboard-django
      dockerfile: Dockerfile
    container_name: opsboard-django-api
    working_dir: /app
    volumes:
      - ../opsboard-django:/app
    ports:
      - "8001:8000"
    environment:
      DJANGO_SECRET_KEY: "dev-secret-key-change-me"
      DJANGO_DEBUG: "1"
      DB_NAME: "opsboard"
      DB_USER: "opsboard"
      DB_PASSWORD: "opsboard_password"
      DB_HOST: "postgres"
      DB_PORT: "5432"
    depends_on:
      - postgres
    networks:
      - opsboard_net
    command: >
      sh -c "python -m pip install --no-cache-dir -r requirements.txt &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    restart: unless-stopped

volumes:
  opsboard_pgdata:

networks:
  opsboard_net:
    name: opsboard_net
    driver: bridge